# gradle.properties

# Silencia el warning "compileSdk 35 no probado con AGP 8.5.2" que
# apareció en el primer intento de build -- no es un error, AGP 8.5.2
# sigue compilando correctamente contra compileSdk 35, solo que Google
# no lo había certificado formalmente al momento de esa versión de AGP.
android.suppressUnsupportedCompileSdk=35

android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
